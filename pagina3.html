<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViajaFácil — Reserva confirmada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="main.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="icon">✈️</span>ViajaFácil</a>
    <div class="header-actions"></div>
  </div>
</header>

<section class="confirm">
  <div class="confirm-card">
    <div class="confirm-check">✓</div>
    <h1>¡Reserva confirmada!</h1>
    <p>Hemos enviado los detalles de tu viaje a<br>juanperez@gmail.com</p>

    <div class="confirm-photo">
      <img src="santiago-puerto-montt.jpg" alt="Santiago → Puerto Montt">
    </div>

    <div class="trip-summary">
      <div class="trip-route">Santiago → Puerto Montt</div>
      <div>📅 15 de junio · 07:30 AM</div>
      <div class="trip-meta">
        <span>💺 Asiento 5C</span>
        <span>👤 1 pasajero</span>
      </div>
    </div>

    <div class="code-box">
      <p>Código de reserva</p>
      <strong>VF-250615-8A2B</strong>
    </div>

    <div class="confirm-actions">
      <a class="btn btn-primary btn-block" href="#">Ver mis viajes</a>
      <a class="btn btn-outline btn-block" href="index.html">Volver al inicio</a>
    </div>
  </div>
</section>

</body>
</html>
