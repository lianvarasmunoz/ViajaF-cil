<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViajaFácil — Ingresa a tu cuenta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="main.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="icon">✈️</span>ViajaFácil</a>
    <div class="header-actions"></div>
  </div>
</header>

<section class="auth">
  <div class="auth-card">
    <h1>Ingresa a tu cuenta</h1>
    <p>Bienvenido de vuelta a ViajaFácil.</p>

    <form>
      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" placeholder="juanperez@gmail.com">
      </div>
      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" placeholder="••••••••">
      </div>
      <a class="auth-forgot" href="#">¿Olvidaste tu contraseña?</a>
      <button class="btn btn-primary btn-block btn-lg" type="button">Iniciar sesión</button>
    </form>

    <div class="auth-divider">o continúa con</div>
    <a class="btn btn-outline btn-block" href="#">Continuar con Google</a>

    <p class="auth-switch">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </div>
</section>

</body>
</html>
